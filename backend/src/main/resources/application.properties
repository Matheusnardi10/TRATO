# ============================================================
# Trato — configuração do backend
# Troque usuario/senha/nome do banco conforme o seu ambiente local.
# ============================================================

spring.application.name=trato-backend
server.port=8080

# PostgreSQL — crie o banco antes de rodar (veja o README, secao "Banco de dados")
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trato}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# "update" cria/ajusta as tabelas automaticamente a partir das entidades,
# nivel adequado para um projeto de estudo (sem precisar escrever migrations).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.com.trato=INFO

# ------------------------------------------------------------
# E-mail (envio do contrato para o cliente aprovar)
# Todos os contratos saem da conta do sistema (sistematrato@gmail.com).
# A senha NAO fica aqui: passe a "senha de app" do Google na variavel
# MAIL_PASSWORD ao subir o backend. Sem ela o backend NAO envia e-mail: o
# link de aprovacao aparece no log e no botao "Copiar link" da tela do
# contrato (bom para testar local).
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sistematrato@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
trato.email.remetente=${MAIL_FROM:Trato <sistematrato@gmail.com>}

# Endereco do frontend usado para montar o link que vai no e-mail.
trato.frontend-url=${TRATO_FRONTEND_URL:http://localhost:4200}
