<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — Trato</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/agenda.css">
</head>
<body>

<aside id="sidebar"></aside>

<div class="app">
  <header id="header"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h2>Agenda</h2>
        <p class="sub">Cada serviço mostra o valor e o lucro estimado do dia.</p>
      </div>
      <button class="btn btn-primary" type="button" id="btn-novo-agendamento">+ Novo agendamento</button>
    </div>

    <div id="alerta-conflitos"></div>

    <div class="agenda-toolbar">
      <div class="agenda-nav">
        <button type="button" id="nav-anterior">←</button>
        <button type="button" id="nav-hoje" class="btn btn-secondary btn-sm">Hoje</button>
        <button type="button" id="nav-proximo">→</button>
      </div>
      <div class="agenda-titulo" id="agenda-titulo"></div>
      <div class="agenda-views">
        <button class="chip active" type="button" data-view="mes">Mês</button>
        <button class="chip" type="button" data-view="semana">Semana</button>
        <button class="chip" type="button" data-view="dia">Dia</button>
      </div>
    </div>

    <div id="agenda-conteudo"></div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/services.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/agenda.js"></script>
</body>
</html>
