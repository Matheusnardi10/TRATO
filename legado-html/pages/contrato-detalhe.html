<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrato — Trato</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/print.css">
</head>
<body>

<aside id="sidebar" class="no-print"></aside>

<div class="app">
  <header id="header" class="no-print"></header>

  <main class="page" style="max-width:980px">
    <div class="row-between no-print mb-16">
      <a href="contratos.html" class="small muted">← Voltar para contratos</a>
      <div class="row gap-8" id="acoes-contrato"></div>
    </div>

    <div class="card mb-16 no-print" id="faixa-status"></div>

    <div class="grid grid-2 no-print mb-16">
      <section class="card">
        <div class="card-head"><h3>Serviços vinculados</h3></div>
        <div class="card-body" id="servicos-vinculados"></div>
        <div class="card-foot"><button class="btn btn-primary btn-block btn-sm" type="button" id="btn-criar-servico">+ Criar serviço a partir deste contrato</button></div>
      </section>
      <section class="card">
        <div class="card-head row-between"><h3>Aditivos</h3><button class="btn btn-secondary btn-sm" type="button" id="btn-novo-aditivo">+ Novo aditivo</button></div>
        <div class="card-body" id="lista-aditivos"></div>
      </section>
    </div>

    <div class="doc" id="documento"></div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/services.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/contrato-detalhe.js"></script>
