<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamentos — Trato</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<aside id="sidebar"></aside>

<div class="app">
  <header id="header"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h2>Orçamentos</h2>
        <p class="sub" id="contagem-orcamentos"></p>
      </div>
      <a class="btn btn-primary" href="orcamento-novo.html">+ Novo orçamento</a>
    </div>

    <div class="filters">
      <div class="search">
        <span class="search-icon">🔎</span>
        <input class="input" type="text" id="busca" placeholder="Buscar por cliente ou título...">
      </div>
      <button class="chip active" type="button" data-status="todos">Todos</button>
      <button class="chip" type="button" data-status="rascunho">Rascunhos</button>
      <button class="chip" type="button" data-status="enviado">Enviados</button>
      <button class="chip" type="button" data-status="aguardando">Aguardando</button>
      <button class="chip" type="button" data-status="aprovado">Aprovados</button>
      <button class="chip" type="button" data-status="recusado">Recusados</button>
    </div>

    <section class="card">
      <div class="table-wrap" id="tabela-orcamentos"></div>
    </section>
  </main>
</div>

<script src="../js/utils.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/services.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/orcamentos.js"></script>
</body>
</html>
