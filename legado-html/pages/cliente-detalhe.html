<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente — Trato</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<aside id="sidebar"></aside>

<div class="app">
  <header id="header"></header>

  <main class="page">
    <a href="clientes.html" class="small muted" style="display:inline-block;margin-bottom:12px">← Voltar para clientes</a>

    <div class="page-head">
      <div class="row gap-16">
        <span class="avatar" id="cliente-avatar" style="width:52px;height:52px;font-size:18px"></span>
        <div>
          <h2 id="cliente-nome" style="margin-bottom:2px"></h2>
          <p class="sub" id="cliente-sub"></p>
        </div>
      </div>
      <div class="row gap-8">
        <button class="btn btn-secondary" type="button" id="btn-editar">✏️ Editar</button>
        <button class="btn btn-primary" type="button" id="btn-orcamento">+ Novo orçamento</button>
      </div>
    </div>

    <div class="grid grid-main">
      <div class="grid" style="align-content:start">
        <section class="card">
          <div class="card-head"><h3>Resumo</h3></div>
          <div class="card-body" id="resumo-cliente"></div>
        </section>

        <section class="card">
          <div class="tabs" id="tabs-historico" style="margin:0 18px;padding-top:16px"></div>
          <div class="card-body tight" id="conteudo-historico"></div>
        </section>
      </div>

      <div class="grid" style="align-content:start">
        <section class="card">
          <div class="card-head"><h3>Dados de contato</h3></div>
          <div class="card-body" id="dados-cliente"></div>
        </section>
        <section class="card">
          <div class="card-head"><h3>Observações</h3></div>
          <div class="card-body" id="observacoes-cliente"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/services.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/cliente-detalhe.js"></script>
</body>
</html>
