<main class="page" style="max-width:900px; margin:0 auto; padding:48px 24px">
  <div class="page-head">
    <div>
      <h2>Qual é o seu tipo de serviço?</h2>
      <p class="sub">Isso define os campos do seu orçamento e o modelo de contrato.</p>
    </div>
  </div>

  <div class="grade-nichos" style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px">
    @for (n of nichos; track n.id) {
      <button type="button" class="nicho-chip card" [class.active]="selecionado === n.id"
              style="padding:16px; text-align:left; cursor:pointer"
              (click)="escolher(n.id)">
        <div style="font-size:24px">{{ n.emoji }}</div>
        <strong>{{ n.nome }}</strong>
        <p class="small muted mb-0">{{ n.descricao }}</p>
      </button>
    }
  </div>

  <div style="margin-top:24px">
    <button class="btn btn-primary btn-lg" type="button" [disabled]="!selecionado || salvando" (click)="continuar()">
      {{ salvando ? 'Salvando...' : 'Continuar' }}
    </button>
  </div>
</main>
